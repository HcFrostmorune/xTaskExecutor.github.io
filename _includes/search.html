<!-- Search -->
<div class="search-page" id="search" aria-hidden="true">
  <div class="search-icon-close-container">
    <span class="search-icon-close" role="button" tabindex="0" aria-label="Close search">
      <i class="fa fa-chevron-down"></i>
    </span>
  </div>
  <div class="search-main container">
    <div class="row">
      <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">
        <form class="search-form" role="search">
          <label class="sr-only" for="search-input">Search posts</label>
          <span class="search-prompt">/</span>
          <input type="search" id="search-input" placeholder="Search the archive..." autocomplete="off">
        </form>
        <div id="search-results" class="mini-post-list"></div>
      </div>
    </div>
  </div>
</div>
